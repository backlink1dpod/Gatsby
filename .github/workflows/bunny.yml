name: Deploy Gatsby site to Bunny.net

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Lấy source từ GitHub
      - name: Checkout source
        uses: actions/checkout@v3

      # Upload chỉ thư mục public (site đã build sẵn)
      - name: Deploy public/ to Bunny Storage
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: sg.storage.bunnycdn.com
          username: bl1d
          password: ${{ secrets.BUNNY_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./public/
          server-dir: /bl1d/
          log-level: minimal
          state-name: .ftp-deploy-sync-state.json
